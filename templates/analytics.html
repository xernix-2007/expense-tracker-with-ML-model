{% extends 'base.html' %}{% block heading %}Analytics{% endblock %}{% block content %}<div class="grid"><div class="panel wide"><div class="panel-head"><h3>Monthly spending</h3></div><canvas id="monthly" height="120"></canvas></div><div class="panel"><div class="panel-head"><h3>Category breakdown</h3></div><canvas id="category"></canvas></div></div>{% endblock %}{% block scripts %}<script>const m={{ monthly|tojson }},c={{ category_data|tojson }};new Chart(document.getElementById('monthly'),{type:'bar',data:{labels:Object.keys(m),datasets:[{label:'Spend',data:Object.values(m)}]},options:{scales:{y:{beginAtZero:true}}}});new Chart(document.getElementById('category'),{type:'doughnut',data:{labels:Object.keys(c),datasets:[{data:Object.values(c)}]},options:{plugins:{legend:{position:'bottom'}}}});</script>{% endblock %}
